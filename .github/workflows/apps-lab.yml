name: App lab

# Not to merge: an experiment to see what xapp misses, on a group of
# different applications, one for each source of the wizard (Arch, AUR,
# an archive by URL, a directory). For each: the wizard alone makes the
# recipe (`xapp --yes create`), xapp builds it, lab/apps/analyze.sh looks
# at the image from outside, then lab/apps/vm.sh runs it in a XeeonOS VM
# with --trace and prints what it said and left. The result is the logs
# (and the VERDICT line of each), not a pass or a fail. The xapp used is
# the one of xeeonos-extensions at XAPP_REF, in the build and in the VM.

on:
  pull_request:
    paths:
      - lab/apps/**
      - .github/workflows/apps-lab.yml
  workflow_dispatch:
    inputs:
      xapp_ref:
        description: Branch of xeeonos-extensions with the xapp to try
        default: testing

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SNAPSHOT: 2026/11/13
  XAPP_REF: ${{ inputs.xapp_ref || 'testing' }}

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch: 32-bit (multilib) and its own runtime downloaded at start.
          - name: steam
            create: --arch steam
            run_for: 600
          # Arch: 32-bit and 64-bit programs, a program to start.
          - name: wine
            create: --arch wine
            args: winecfg
            run_for: 240
          # Arch: Electron, downloaded at start.
          - name: discord
            create: --arch discord
            run_for: 300
          # Arch: an application that works today (nothing must break).
          - name: vlc
            create: --arch vlc
            run_for: 180
          # AUR: Java, started by a script.
          - name: jdownloader2
            create: --aur jdownloader2 --pkgbuild-ok
            run_for: 300
          # An archive by URL: the official Firefox.
          - name: firefox-url
            create: --url https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US
            run_for: 180
          # A directory: the official VSCodium archive, unpacked (Electron).
          - name: vscodium-dir
            create: --dir
            run_for: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivansollazzo/xeeonos-extensions
          ref: ${{ env.XAPP_REF }}
          path: xeeonos-extensions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivansollazzo/xeeonos
          ref: testing
          path: xeeonos
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils jq qemu-system-x86 ovmf dosfstools mtools fdisk zstd >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          rustup update stable && rustup default stable
          (cd xeeonos-extensions/extensions/xapp/source && cargo build --release --locked --quiet)
          echo "XAPP=$PWD/xeeonos-extensions/extensions/xapp/source/target/release/xapp" >> "$GITHUB_ENV"
          echo "xapp of xeeonos-extensions $XAPP_REF ($(git -C xeeonos-extensions rev-parse --short HEAD))"
      - name: The wizard alone
        env:
          CREATE: ${{ matrix.create }}
        run: |
          read -r -a create <<< "$CREATE"
          if [[ ${create[0]} == --dir ]]; then
              # The official VSCodium archive, unpacked: a directory of the user.
              url=$(curl -fsSL https://api.github.com/repos/VSCodium/vscodium/releases/latest |
                  jq -r '.assets[].browser_download_url | select(test("VSCodium-linux-x64-.*\\.tar\\.gz$"))')
              mkdir -p "$RUNNER_TEMP/VSCodium"
              curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/VSCodium"
              create=(--dir "$RUNNER_TEMP/VSCodium")
          fi
          "$XAPP" --yes create "${create[@]}" --snapshot "$SNAPSHOT" \
              --output "$RUNNER_TEMP/recipe" --no-build 2>&1 | tee "$RUNNER_TEMP/wizard.log"
          echo "----- recipe.json"
          cat "$RUNNER_TEMP/recipe/recipe.json"
      - name: Build
        run: |
          mkdir -p vm-http
          "$XAPP" build "$RUNNER_TEMP/recipe" --key "$RUNNER_TEMP/ci.key" --output vm-http/app.xapp \
              --work "$RUNNER_TEMP/work" --no-install 2>&1 | tee "$RUNNER_TEMP/build.log"
          "$XAPP" verify vm-http/app.xapp
          "$XAPP" info vm-http/app.xapp
          jq -r .app_id "$RUNNER_TEMP/recipe/recipe.json" > vm-http/app_id
          printf '%s\n' "${{ matrix.args }}" > vm-http/args
          echo "${{ matrix.run_for }}" > vm-http/run_for
          cp "$XAPP" vm-http/xapp
          rm -rf "$RUNNER_TEMP/work"
      - name: Analysis of the image
        run: |
          # The image is at the start of the .xapp (erofs ignores the rest).
          mkdir -p "$RUNNER_TEMP/root"
          fsck.erofs --extract="$RUNNER_TEMP/root" vm-http/app.xapp >/dev/null 2>&1 || true
          bash lab/apps/analyze.sh "$RUNNER_TEMP/root" "$RUNNER_TEMP/build.log"
          rm -rf "$RUNNER_TEMP/root"
      - name: The newest testing image of XeeonOS
        id: image
        run: |
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:ivansollazzo/xeeonos:pull" | jq -r .token)
          version=$(curl -sSf -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/ivansollazzo/xeeonos/tags/list?n=1000" |
              jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+-testing\.' | sort -V | tail -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "XeeonOS $version"
      - name: Disk
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/system"
          xeeonos-extensions/tools/fetch-system.sh --boot "$VERSION" "$RUNNER_TEMP/system"
          sudo xeeonos-extensions/tools/mkdisk.sh "$RUNNER_TEMP/system" "$VERSION" "$RUNNER_TEMP/xeeonos.raw"
          sudo chown "$USER:$USER" "$RUNNER_TEMP/xeeonos.raw"
          rm -rf "$RUNNER_TEMP/system"
      - name: Run it in a XeeonOS VM
        run: |
          printf '%s\n' language=en_US.UTF-8 hostname=lab user=test \
              "fullname=Lab" password=test-password admin=yes > "$RUNNER_TEMP/setup.txt"
          TIMEOUT=$(( ${{ matrix.run_for }} + 900 )) DISK_SIZE=40G xeeonos/tools/boot-test.sh \
              --setup "$RUNNER_TEMP/setup.txt" \
              --http "$PWD/vm-http" \
              --credential lab="$PWD/lab/apps/vm.sh" \
              --run "/bin/bash /run/credentials/@system/lab" \
              --expect "LAB-DONE" \
              "$RUNNER_TEMP/xeeonos.raw" "$RUNNER_TEMP/serial.log"
      - name: What the application printed (from the serial log)
        if: always()
        run: grep -a 'LAB|' "$RUNNER_TEMP/serial.log" | sed 's/^.*LAB| //' || true

name: Steam lab

# Not to merge: an experiment to see what Steam needs from xapp. The
# wizard makes the recipe on its own (`xapp --yes create --arch steam`),
# xapp builds it, lab/steam/analyze.sh looks at the image from outside,
# then lab/steam/vm.sh runs it in a XeeonOS VM and prints what it said and
# left. Everything is in the job logs (the result is the logs, not a
# pass or a fail).

on:
  pull_request:
    paths:
      - lab/steam/**
      - .github/workflows/steam-lab.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SNAPSHOT: 2026/11/13
  XAPP_REF: testing

jobs:
  build:
    name: Wizard, build, analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivansollazzo/xeeonos-extensions
          ref: ${{ env.XAPP_REF }}
          path: xeeonos-extensions
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils jq >/dev/null
          rustup update stable && rustup default stable
          (cd xeeonos-extensions/extensions/xapp/source && cargo build --release --locked --quiet)
          echo "XAPP=$PWD/xeeonos-extensions/extensions/xapp/source/target/release/xapp" >> "$GITHUB_ENV"
      - name: The wizard alone (xapp --yes create --arch steam)
        run: |
          "$XAPP" --yes create --arch steam --snapshot "$SNAPSHOT" \
              --output "$RUNNER_TEMP/recipe" --no-build 2>&1 | tee "$RUNNER_TEMP/wizard.log"
          echo "----- recipe.json"
          cat "$RUNNER_TEMP/recipe/recipe.json"
          ls -la "$RUNNER_TEMP/recipe"
      - name: What a user added by hand (lab/steam/edits.jq)
        run: |
          r=$RUNNER_TEMP/recipe/recipe.json
          jq -f lab/steam/edits.jq "$r" > "$r.new" && mv "$r.new" "$r"
          diff <(echo) <(jq -c .packages "$r") || true
      - name: Build
        run: |
          mkdir -p out
          set -o pipefail
          "$XAPP" build "$RUNNER_TEMP/recipe" --key out/ci.key --output out/app.xapp \
              --work "$RUNNER_TEMP/work" --no-install 2>&1 | tee "$RUNNER_TEMP/build.log"
          "$XAPP" verify out/app.xapp
          "$XAPP" info out/app.xapp
          jq -r .app_id "$RUNNER_TEMP/recipe/recipe.json" > out/app_id
      - name: Analysis of the image
        if: always()
        run: |
          # The image is at the start of the .xapp (erofs ignores the rest).
          image=out/app.xapp
          test -s "$image" || { echo "no image"; exit 0; }
          mkdir -p "$RUNNER_TEMP/root"
          fsck.erofs --extract="$RUNNER_TEMP/root" --no-preserve "$image" >/dev/null 2>&1 ||
              fsck.erofs --extract="$RUNNER_TEMP/root" "$image" >/dev/null 2>&1 || true
          bash lab/steam/analyze.sh "$RUNNER_TEMP/root" "$RUNNER_TEMP/build.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-app
          path: |
            out/app.xapp
            out/app_id
          retention-days: 3

  vm:
    name: Steam in a XeeonOS VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivansollazzo/xeeonos
          ref: testing
          path: xeeonos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivansollazzo/xeeonos-extensions
          ref: ${{ env.XAPP_REF }}
          path: xeeonos-extensions
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lab-app
          path: vm-http
      - name: QEMU and disk tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf dosfstools mtools fdisk zstd erofs-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: The newest testing image of XeeonOS
        id: image
        run: |
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:ivansollazzo/xeeonos:pull" | jq -r .token)
          version=$(curl -sSf -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/ivansollazzo/xeeonos/tags/list?n=1000" |
              jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+-testing\.' | sort -V | tail -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "XeeonOS $version"
      - name: Disk
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/system"
          xeeonos-extensions/tools/fetch-system.sh --boot "$VERSION" "$RUNNER_TEMP/system"
          sudo xeeonos-extensions/tools/mkdisk.sh "$RUNNER_TEMP/system" "$VERSION" "$RUNNER_TEMP/xeeonos.raw"
          sudo chown "$USER:$USER" "$RUNNER_TEMP/xeeonos.raw"
          rm -rf "$RUNNER_TEMP/system"
      - name: Run it and print what it says
        run: |
          printf '%s\n' language=en_US.UTF-8 hostname=lab user=test \
              "fullname=Lab" password=test-password admin=yes > "$RUNNER_TEMP/setup.txt"
          TIMEOUT=2700 DISK_SIZE=40G xeeonos/tools/boot-test.sh \
              --setup "$RUNNER_TEMP/setup.txt" \
              --http "$PWD/vm-http" \
              --credential lab="$PWD/lab/steam/vm.sh" \
              --run "/bin/bash /run/credentials/@system/lab" \
              --expect "LAB-DONE" \
              "$RUNNER_TEMP/xeeonos.raw" "$RUNNER_TEMP/serial.log"
      - name: What the application printed (from the serial log)
        if: always()
        run: grep -a 'LAB|' "$RUNNER_TEMP/serial.log" | sed 's/^.*LAB| //' || true
